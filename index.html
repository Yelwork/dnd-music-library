<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DnD 跑團音樂庫 | LMoP & DoIP</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>🎲 DnD 跑團音樂庫</h1>
    <p>凡戴爾的失落礦坑 · 冰塔峰之龍</p>
    <div class="search-bar">
      <input type="text" id="search" placeholder="搜尋曲目、地點、情緒...">
    </div>
    <div style="margin-top:12px;">
      <button id="fav-btn" class="back-btn" style="font-size:0.95rem;">⭐ 我的收藏</button>
    </div>
    <div class="hotkey-hint" style="margin-top:8px; font-size:0.8rem; color:var(--muted);">
      快捷鍵：1酒館 2戰鬥 3洞穴 4旅行 5休息 · 空格停止音樂 · M靜音音樂
    </div>
  </header>

  <main id="main">
    <!-- Categories or track list will be injected here -->
  </main>

  <div class="player" id="player">
    <div class="player-section">
      <div class="player-label">音樂</div>
      <div class="player-info">
        <div class="now-playing" id="now-playing">選擇音樂</div>
      </div>
      <div class="player-controls">
        <button id="stop-btn">停止</button>
        <label><input type="checkbox" id="loop"> 循環</label>
        <div class="volume-control">
          <span>🔊</span>
          <input type="range" id="volume" min="0" max="100" value="70">
        </div>
      </div>
      <div id="youtube-container"></div>
    </div>

    <div class="player-section ambience-section">
      <div class="player-label">環境音</div>
      <div class="player-info">
        <div class="now-playing" id="now-playing-amb">無環境音</div>
      </div>
      <div class="player-controls">
        <button id="stop-amb-btn">停止</button>
        <div class="volume-control">
          <span>🔉</span>
          <input type="range" id="volume-amb" min="0" max="100" value="40">
        </div>
      </div>
      <div id="youtube-container-amb"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
